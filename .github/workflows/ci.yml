name: CI

on:
  push:
    branches:
      - main
      - public-main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Run tests
        run: ./mvnw clean test

      - name: Build plugin jar
        run: ./mvnw clean -DskipTests package

      - name: Upload plugin jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-builder-plugin-jar
          path: |
            target/Macro_Builder-*.jar
            !target/*-sources.jar
            !target/*-tests.jar
          if-no-files-found: error
